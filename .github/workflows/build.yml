name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools fdisk cpio bzip2 xz-utils

      - uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('versions.sh', 'config/firmware.sha256') }}

      # vhusbd is proprietary and not redistributed: users copy it onto the
      # SD card themselves (see README).
      - name: Build
        run: VHUSBD=0 ./build.sh

      - name: Compress
        run: xz -T0 -9 out/*.img

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/*.img.xz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.img.xz --generate-notes
