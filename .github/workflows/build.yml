name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The busybox dialect needs shellcheck >= 0.10; the runner has 0.9.
      - name: Install shellcheck 0.10.0
        run: |
          curl -fsSL -o sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  sc.tar.xz" | sha256sum -c
          tar -xJf sc.tar.xz
          sudo install shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
      - name: shellcheck
        run: |
          shellcheck -s sh build.sh scripts/deploy.sh scripts/qemu-test.sh versions.sh
          shellcheck -s bash scripts/boottime.sh scripts/loadtest.sh
          shellcheck -s busybox rootfs/common/etc/rc rootfs/common/etc/functions \
            rootfs/common/etc/init.d/* rootfs/common/usr/share/*/default.script \
            rootfs/debug/etc/rc.debug rootfs/debug/etc/init.d/* rootfs/debug/etc/variant.env

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools fdisk cpio bzip2 xz-utils

      - uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('versions.sh', 'config/firmware.sha256') }}

      # vhusbd is proprietary and not redistributed: users copy it onto the
      # SD card themselves (see README).
      - name: Build
        run: VHUSBD=0 ./build.sh

      # Builds are reproducible: SHA256SUMS lets anyone check these images
      # against their own build of the same commit (with VHUSBD=0).
      - name: Checksums and compress
        run: |
          cd out
          sha256sum *.img > SHA256SUMS
          xz -T0 -9 *.img

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: |
            out/*.img.xz
            out/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.img.xz out/SHA256SUMS --generate-notes
